name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++-14, clang++-18]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build g++-14 clang-18 clang-format-18 clang-tidy-18

      - name: Check formatting
        run: clang-format-18 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build

      - name: Run clang-tidy
        run: clang-tidy-18 -p build $(git ls-files 'v*/*.cpp' 'bench/*.cpp')

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
